version: "3.9"

services:
  fastapi-proxy:
    build:
      context: ./fastapi-proxy
    container_name: neurofit-proxy
    ports:
      - "3001:3001"
    restart: unless-stopped
    extra_hosts:
      - "host.docker.internal:host-gateway"

  ollama:
    image: ollama/ollama:latest
    container_name: neurofit-ollama
    ports:
      - "11434:11434"
    volumes:
      - ~/.ollama:/root/.ollama
    restart: unless-stopped